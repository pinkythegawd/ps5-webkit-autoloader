name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native:
    name: Installer ELF + host script (SDK Docker)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Non-recursive on purpose: remote-loader's nested copy of this
          # repository is not a build input.
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Offline checks
        run: make test

      - name: Compute build version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            BUILD_TYPE=stable
          else
            BUILD_TYPE=dev
          fi
          version="$(BUILD_TYPE=$BUILD_TYPE python3 tools/gen_version.py --print)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "BUILD_VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_TYPE=$BUILD_TYPE" >> "$GITHUB_ENV"

      - name: Build installer ELF and host script
        run: BUILD_TYPE=$BUILD_TYPE ./build_release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: native
          path: |
            webkit-autoloader-installer_v*.elf
            webkit-autoloader-host_v*.py
          if-no-files-found: error

  exe:
    name: Windows .exe (PyInstaller)
    runs-on: windows-latest
    needs: native
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Package host script as .exe
        shell: bash
        run: |
          pip install pyinstaller
          script="$(ls webkit-autoloader-host_v*.py)"
          python -m PyInstaller --onefile --clean -y --distpath . \
            --name "webkit-autoloader-host_v${{ needs.native.outputs.version }}" \
            "$script"

      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: webkit-autoloader-host_v*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [native, exe]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native

      - uses: actions/download-artifact@v4
        with:
          name: exe

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(webkit-autoloader-installer_v*.elf webkit-autoloader-host_v*.py webkit-autoloader-host_v*.exe)
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "WebKit Autoloader v${{ needs.native.outputs.version }} by MikePinku" \
            --generate-notes \
            "${files[@]}" \
          || gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --clobber \
            "${files[@]}"
